<style>
/* ==========================================================================
   Madani — the link thread.
   --------------------------------------------------------------------------
   Not a list of buttons: the whole page is one conversation. Madani types,
   the links arrive inside the thread (a chat-style preview card for the
   work, the yellow chips for channels), and the email capture is the reply
   field. You answer the thread; your reply becomes your own bubble.
   Identical tokens to the portfolio: white ground, SF Pro speech, mono only
   on chips, one shared shadow. Arrows appear only on chips, where they mean
   "this leaves the page".
   ========================================================================== */
:root{
  --ink:#111111;
  --txt:#3F3F42;
  --soft:#6E6E68;
  --paper:#FFFFFF;
  --plate:#F8F8F8;
  --mark:#FFFF00;
  --rule:#E6E6E1;
  --dot:#B9B8B3;
  --shadow:0 2px 4px rgba(0,0,0,.16);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad-x:clamp(16px, 4vw, 40px);
}

*,*::before,*::after{box-sizing:border-box}
::selection{background:var(--mark);color:var(--ink)}

html{-webkit-text-size-adjust:100%;color-scheme:light}
body{
  margin:0;color:var(--ink);
  background:radial-gradient(rgba(17,17,17,.055) 1px, transparent 1.1px) 0 0 / 22px 22px,
             var(--paper);
  font-family:var(--sans);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100svh;display:flex;flex-direction:column;
}

.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
:where(a,button,input):focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}

/* ---- the thread ------------------------------------------------------------- */
main{
  flex:1 0 auto;width:100%;max-width:480px;margin:0 auto;
  padding:clamp(28px,10vh,96px) var(--pad-x) 64px;
}
.thread{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

.bubble{
  max-width:min(330px,100%);
  text-wrap:pretty;
  background:#FFFFFF;color:var(--txt);
  border:1px solid var(--rule);
  font-size:17px;line-height:1.4;letter-spacing:-0.01em;
  padding:10px 15px 11px;
  border-radius:18px 18px 18px 5px;
  box-shadow:var(--shadow);
  transition:width .25s ease;
  animation:pop .3s cubic-bezier(.22,1,.36,1);
}
.bubble b{color:var(--ink);font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.bubble + .bubble{border-top-left-radius:5px}

/* your reply, once you send it */
.bubble.me{
  align-self:flex-end;
  background:var(--ink);color:var(--paper);border-color:var(--ink);
  border-radius:18px;border-bottom-right-radius:5px;
}

.dots{display:inline-flex;gap:4px;padding:3px 2px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---- attachments: things that arrive inside the conversation ------------------ */
.attach{animation:pop .35s cubic-bezier(.22,1,.36,1)}

/* the work, as a chat link preview */
.preview{
  display:block;width:min(300px,100%);
  text-decoration:none;color:inherit;
  background:#FFFFFF;border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden;
  transition:transform .18s cubic-bezier(.22,1,.36,1);
}
.preview .covers{display:flex;gap:2px;background:#FFFFFF}
.preview .covers img{width:calc((100% - 4px)/3);height:118px;object-fit:cover;display:block}
.preview .label{
  display:block;padding:10px 14px 11px;
  font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);
}
@media (hover:hover){ .preview:hover{transform:translateY(-2px)} }
.preview:active{transform:scale(.99)}

/* channels, as the yellow chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:2px 0;padding:0}
.chip{
  display:inline-block;font:400 11px/1 var(--mono);
  background:var(--mark);color:var(--ink);
  padding:5px 8px;text-decoration:none;
}
a.chip:hover{text-decoration:underline}
@media (pointer:coarse){ .chip{font-size:11px;padding:8px 10px} }

/* the reply field: answering the thread is the email capture */
.composer{display:flex;gap:8px;width:min(330px,100%);margin-top:6px}
.composer input{
  flex:1;min-width:0;
  font:400 16px/1 var(--sans);color:var(--ink);
  background:var(--plate);border:1px solid var(--rule);border-radius:999px;
  padding:12px 16px;
}
.composer input::placeholder{color:#9A9994}
.composer button{
  flex:none;cursor:pointer;
  font:400 12px/1 var(--mono);color:var(--ink);
  background:var(--mark);border:0;border-radius:999px;
  padding:0 18px;
  transition:transform .18s cubic-bezier(.22,1,.36,1);
}
@media (hover:hover){ .composer button:hover{transform:translateY(-1px)} }
.composer button:active{transform:scale(.97)}
.composer.sent{opacity:.45;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<main>
  <h1 class="sr-only">Madani — designer, design distribution</h1>
  <div class="thread" id="thread" aria-label="A conversation from Madani"></div>
</main>

<script>
"use strict";
/* ==========================================================================
   The thread plays like a real exchange: messages type themselves (ellipsis
   before the first one only), and the links arrive as attachments at the
   moment they come up in conversation. Submitting your email plays back as
   your own reply, then Madani confirms.
   ========================================================================== */

const WORK_URL = "../";     /* the portfolio, one level up */
/* MailerLite form endpoint (from the previous site) — fire-and-forget */
const ML_URL = "https://assets.mailerlite.com/jsonp/2332129/forms/186973118692066415/subscribe";

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
const thread  = document.getElementById("thread");
const el = (tag, cls) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  return n;
};
const segs = s => s.split("**").map((t, i) => ({ t, b:i % 2 === 1 }));

function hug(bub){
  if (!bub.offsetWidth) return;
  const rng = document.createRange();
  rng.selectNodeContents(bub);
  const w = rng.getBoundingClientRect().width;
  if (w) bub.style.width = Math.min(330, Math.ceil(w) + 33) + "px";
}

/* ---- attachments ----------------------------------------------------------- */

function makePreview(){
  const a = el("a", "preview attach");
  a.href = WORK_URL;
  const row = el("span", "covers");
  ["../assets/work/shovel-1.jpg", "../assets/work/mv-4.jpg", "../assets/work/collab-parc.jpg"]
    .forEach(src => {
      const im = el("img");
      im.src = src; im.alt = ""; im.decoding = "async";
      row.appendChild(im);
    });
  const lb = el("span", "label");
  lb.textContent = "See the work";
  a.append(row, lb);
  return a;
}

function makeChips(){
  const ul = el("ul", "chips attach");
  [["email", "mailto:abdelrahmanpersonal@gmail.com"],
   ["instagram", "https://www.instagram.com/madanivision/"],
   ["are.na", "https://www.are.na/madani/channels"]].forEach(pair => {
    const li = el("li");
    const a = el("a", "chip");
    a.href = pair[1];
    if (/^https?:/i.test(pair[1])){ a.target = "_blank"; a.rel = "noopener"; }
    a.textContent = pair[0] + " ↗";
    li.appendChild(a);
    ul.appendChild(li);
  });
  return ul;
}

function makeComposer(){
  const f = el("form", "composer attach");
  f.id = "reply";
  f.innerHTML =
    '<label class="sr-only" for="reply-email">Your email</label>' +
    '<input id="reply-email" type="email" required placeholder="your@email.com"' +
    ' autocomplete="email" inputmode="email">' +
    '<button type="submit">send</button>';
  f.addEventListener("submit", onReply);
  return f;
}

/* ---- the script of the conversation ----------------------------------------- */

const THREAD = [
  { say:"Hey, I’m **Madani**. I help studios get their work seen." },
  { show:makePreview },
  { show:makeChips },
  { say:"Want the **design pack**? Type specimens, layouts, grids. One email, no weird spam." },
  { show:makeComposer }
];

const DOTS_MS = 360, CHAR_MS = 9, GAP_MS = 160;

function fillBubble(b, text){
  segs(text).forEach(sg => b.appendChild(sg.b
    ? Object.assign(el("b"), { textContent:sg.t })
    : document.createTextNode(sg.t)));
}

let step = 0, playing = false;

function playAll(){                       /* reduced motion, or a skip */
  if (playing === "done") return;
  playing = "done";
  thread.textContent = "";
  THREAD.forEach(it => {
    if (it.say){ const b = el("div", "bubble"); fillBubble(b, it.say); thread.appendChild(b); hug(b); }
    else thread.appendChild(it.show());
  });
}

function next(first){
  if (playing === "done") return;
  if (step >= THREAD.length){ playing = "done"; return; }
  const it = THREAD[step++];

  if (it.show){ thread.appendChild(it.show()); setTimeout(next, 420); return; }

  const bub = el("div", "bubble");
  if (first) bub.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  thread.appendChild(bub);
  setTimeout(() => {
    if (playing === "done") return;
    bub.textContent = "";
    const parts = segs(it.say).map(sg => {
      const n = sg.b ? el("b") : document.createTextNode("");
      bub.appendChild(n);
      return { n, text:sg.t, isEl:sg.b };
    });
    let p = 0, c = 0, shown = 0;
    const total = parts.reduce((a, sg) => a + sg.text.length, 0);
    const t0 = performance.now();
    const tick = () => {
      if (playing === "done") return;
      const want = Math.min(total, 1 + Math.floor((performance.now() - t0) / CHAR_MS));
      while (shown < want){
        while (p < parts.length && c >= parts[p].text.length){ p++; c = 0; }
        c++; shown++;
        if (parts[p].isEl) parts[p].n.textContent = parts[p].text.slice(0, c);
        else               parts[p].n.nodeValue   = parts[p].text.slice(0, c);
      }
      if (shown >= total){ hug(bub); setTimeout(next, GAP_MS); return; }
      requestAnimationFrame(tick);
    };
    tick();
  }, first ? DOTS_MS : 0);
}

if (reduced.matches) playAll();
else next(true);

/* keyboard users get the whole thread at once */
document.addEventListener("focusin", ev => {
  if (!ev.target.closest(".composer")) playAll();
}, { once:true });

/* ---- replying -------------------------------------------------------------- */

function onReply(ev){
  ev.preventDefault();
  const form = ev.currentTarget;
  const addr = form.querySelector("input").value.trim();
  if (!addr) return;
  form.classList.add("sent");

  const mine = el("div", "bubble me");
  mine.textContent = addr;
  thread.appendChild(mine);

  const ack = el("div", "bubble");
  ack.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  thread.appendChild(ack);

  /* the real send: MailerLite takes it from here */
  const d = new FormData();
  d.append("fields[email]", addr);
  d.append("ml-submit", "1");
  try { fetch(ML_URL, { method:"POST", mode:"no-cors", body:d }); } catch (_){}

  setTimeout(() => {
    ack.textContent = "";
    fillBubble(ack, "**Got it.** Check your inbox soon.");
    hug(ack);
  }, reduced.matches ? 30 : 800);
}
</script>
<script data-goatcounter="https://madani.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
